<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor IA · Métricas Meta</title><style>
:root{--bg:#0b1020;--surface:#131b31;--line:#2c3a5d;--text:#f4f7ff;--muted:#99a7c4;--brand:#7d9cff;--accent:#40d9a4;--warn:#ffbf69;--danger:#ff7285}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 540px at 85% -10%,#27376b 0%,transparent 64%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.wrap{max-width:1540px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:24px;align-items:end;margin-bottom:24px}h1{font-size:29px;letter-spacing:-.7px;margin:0}h2{font-size:16px;margin:0}.eyebrow,.muted{color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:10px;font-weight:800;margin-bottom:7px}.sub{color:var(--muted);margin:8px 0 0}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.filters label{display:grid;gap:5px;color:var(--muted);font-size:11px;font-weight:700}input,button{appearance:none;min-height:39px;border-radius:9px;padding:9px 11px;font:inherit}input{border:1px solid var(--line);background:#10182c;color:var(--text)}button{border:0;background:var(--brand);color:#091024;font-weight:800;cursor:pointer}.account-tabs,.objective-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}.tab{white-space:nowrap;background:var(--surface);border:1px solid var(--line);color:var(--muted)}.tab.active{background:var(--brand);border-color:var(--brand);color:#091024}.objective-tabs{margin:4px 0 17px}.objective-tabs .tab.active{background:#253b75;color:#eaf0ff;border-color:#6484ed}.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px;color:var(--muted)}.dot{width:8px;height:8px;background:var(--accent);border-radius:99px;box-shadow:0 0 15px var(--accent)}.badge{font-size:10px;font-weight:800;padding:4px 7px;border-radius:999px;border:1px solid currentColor}.ok{color:var(--accent)}.warn{color:var(--warn)}.critical{color:var(--danger)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{border:1px solid var(--line);background:linear-gradient(140deg,rgba(25,35,62,.93),rgba(16,24,45,.93));border-radius:14px}.card{padding:15px}.label{font-size:11px;font-weight:700;color:var(--muted)}.value{font-size:23px;font-weight:850;letter-spacing:-.5px;margin:7px 0}.detail{color:#b7c2da;font-size:11px}.panel{padding:18px;margin-top:16px}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:baseline;margin-bottom:12px}.chart{height:230px;display:flex;align-items:end;gap:7px;padding:10px 3px 25px;border-bottom:1px solid var(--line)}.bar{height:var(--h);min-height:3px;flex:1;background:linear-gradient(#91aaff,#46d7a7);border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.callout{line-height:1.65;color:#c0cae0}.callout b{color:var(--text)}.table-wrap{overflow:auto;max-height:540px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:11px 9px;white-space:nowrap;text-align:right;border-bottom:1px solid var(--line)}th{position:sticky;top:0;background:#18223e;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px}td:first-child,th:first-child,td:nth-child(2),th:nth-child(2){text-align:left}td:nth-child(2){max-width:300px;overflow:hidden;text-overflow:ellipsis}.empty{color:var(--muted);padding:28px;text-align:center}.loading{padding:70px 10px;text-align:center;color:var(--muted)}.foot{margin:18px 0 0;color:var(--muted);font-size:11px;line-height:1.5}@media(max-width:950px){.top{display:block}.filters{margin-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:540px){.wrap{padding:17px}.grid{grid-template-columns:1fr}h1{font-size:24px}.card{padding:13px}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">Gestor de Tráfego com IA</div><h1>Métricas de campanhas</h1><p class="sub">Dados exclusivos da Meta Ads API</p></div><div class="filters"><label>De<input id="since" type="date"></label><label>Até<input id="until" type="date"></label><button id="refresh">Atualizar agora</button></div></header><nav id="accounts" class="account-tabs" aria-label="Contas"></nav><div id="content"><div class="loading">Carregando métricas da Meta…</div></div><p class="foot" id="footer"></p></main><script>
let data,accountId,objective='__all__';const $=id=>document.getElementById(id),fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(Number(n)||0),brl=n=>n==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n),pct=n=>Number.isFinite(n)?(n*100).toFixed(2)+'%':'—',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function range(){const date=d=>d.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}),now=new Date();$('until').value=date(now);$('since').value=date(new Date(now-29*864e5))}function selected(){return data.accounts.find(a=>a.id===accountId)||data.accounts[0]}function money(n,a){return a.currency==='BRL'||!a.currency?brl(n):'—'}function card(l,v,d){return `<article class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="detail">${d}</div></article>`}function health(a){return `<span class="badge ${a.health.toLowerCase()}">${a.health}</span>`}
function metrics(rows){const m={spend:0,impressions:0,reach:0,clicks:0,leads:0,purchases:0};rows.forEach(r=>Object.keys(m).forEach(k=>m[k]+=Number(r[k]||0)));return {...m,ctr:m.impressions?m.clicks/m.impressions:null,cpm:m.impressions?m.spend/m.impressions*1000:null,cpc:m.clicks?m.spend/m.clicks:null,cpl:m.leads?m.spend/m.leads:null}}function filtered(a){return objective==='__all__'?a.campaigns:a.campaigns.filter(c=>c.objective===objective)}
function render(){const a=selected();$('accounts').innerHTML=data.accounts.map(x=>`<button class="tab ${x.id===accountId?'active':''}" data-account="${esc(x.id)}">${esc(x.name)}</button>`).join('');$('accounts').querySelectorAll('button').forEach(b=>b.onclick=()=>{accountId=b.dataset.account;objective='__all__';render()});const rows=filtered(a),m=metrics(rows),tabs=['__all__',...a.objectives].map(o=>`<button class="tab ${o===objective?'active':''}" data-objective="${esc(o)}">${o==='__all__'?'Todos os objetivos':esc(o)}</button>`).join(''),daily=objective==='__all__'?a.daily:[],max=Math.max(1,...daily.map(d=>d.spend)),chart=daily.length?daily.map(d=>`<div class="bar" title="${esc(d.date)} · ${money(d.spend,a)}" style="--h:${Math.max(3,d.spend/max*100)}%"><span>${d.date.slice(5)}</span></div>`).join(''):'<div class="empty">A série diária consolidada é exibida na guia “Todos os objetivos”.</div>',table=rows.map(r=>`<tr><td>${esc(r.objective)}</td><td title="${esc(r.id)}">${esc(r.name)}</td><td>${esc(r.status)}</td><td>${money(r.spend,a)}</td><td>${fmt(r.impressions)}</td><td>${fmt(r.reach)}</td><td>${fmt(r.clicks)}</td><td>${pct(r.ctr)}</td><td>${money(r.cpm,a)}</td><td>${money(r.cpc,a)}</td><td>${fmt(r.leads)}</td><td>${money(r.cpl,a)}</td><td>${fmt(r.purchases)}</td></tr>`).join('')||'<tr><td class="empty" colspan="13">Sem dados da Meta para este filtro e período.</td></tr>';$('content').innerHTML=`<div class="status"><span class="dot"></span><span>${esc(a.name)} · ${esc(a.id)}</span>${health(a)}${a.currency?`<span>Moeda Meta: ${esc(a.currency)}</span>`:''}</div><nav class="objective-tabs">${tabs}</nav>${a.limitation?`<section class="panel callout"><b>Limitação:</b> ${esc(a.limitation)}</section>`:''}<section class="grid">${card('Investimento',money(m.spend,a),'Meta · período selecionado')}${card('Impressões',fmt(m.impressions),'Alcance '+fmt(m.reach))}${card('Cliques de link',fmt(m.clicks),'CTR '+pct(m.ctr)+' · CPC '+money(m.cpc,a))}${card('Leads Meta',fmt(m.leads),'CPL '+money(m.cpl,a))}${card('Compras',fmt(m.purchases),'Evento omni_purchase')}${card('CPM',money(m.cpm,a),'Por mil impressões')}${card('Campanhas com dados',fmt(rows.length),'Meta · filtro atual')}${card('Objetivos',fmt(a.objectives.length),'Agrupamento por objetivo Meta')}</section><section class="split"><section class="panel"><div class="panel-head"><h2>Investimento diário</h2><span class="muted">Meta · ${esc(data.range.since)} a ${esc(data.range.until)}</span></div><div class="chart">${chart}</div></section><section class="panel callout"><h2>Leitura dos dados</h2><p><b>Fonte:</b> Meta Ads API. Não há planilhas ou outras fontes neste painel.</p><p><b>Atualização:</b> consulta automática a cada ${data.refreshIntervalSeconds} segundos, sujeita ao tempo de processamento e à disponibilidade da Meta.</p><p><b>Objetivos:</b> as guias usam o campo de objetivo retornado pela Meta para cada campanha.</p></section></section><section class="panel"><div class="panel-head"><h2>Campanhas</h2><span class="muted">Clique em uma guia de objetivo para filtrar</span></div><div class="table-wrap"><table><thead><tr><th>Objetivo</th><th>Campanha</th><th>Status</th><th>Investimento</th><th>Impressões</th><th>Alcance</th><th>Cliques</th><th>CTR</th><th>CPM</th><th>CPC</th><th>Leads Meta</th><th>CPL</th><th>Compras</th></tr></thead><tbody>${table}</tbody></table></div></section>`;$('content').querySelectorAll('[data-objective]').forEach(b=>b.onclick=()=>{objective=b.dataset.objective;render()});$('footer').textContent=`Atualizado em ${new Date(data.generatedAt).toLocaleString('pt-BR')} · Período analisado: ${data.range.since} a ${data.range.until}. Valores são apresentados em BRL quando a moeda da conta na Meta é BRL.`}
async function load(force=false){$('content').innerHTML='<div class="loading">Atualizando dados da Meta…</div>';const q=new URLSearchParams({since:$('since').value,until:$('until').value});if(force)q.set('refresh','1');const response=await fetch('/api/dashboard?'+q);data=await response.json();if(!response.ok||data.error)throw new Error(data.error||'Falha ao atualizar.');accountId=data.accounts.some(a=>a.id===accountId)?accountId:data.accounts[0]?.id;render()}function fail(e){$('content').innerHTML=`<div class="loading">Erro: ${esc(e.message)}</div>`}range();$('refresh').onclick=()=>load(true).catch(fail);['since','until'].forEach(id=>$(id).onchange=()=>load().catch(fail));load().catch(fail);setInterval(()=>load().catch(()=>{}),60000);
</script></body></html>
