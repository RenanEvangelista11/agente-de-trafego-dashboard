<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestor IA · Dashboard do cliente</title><style>:root{--bg:#0b1020;--panel:#151e35;--line:#2c3a5d;--text:#f4f7ff;--muted:#99a7c4;--brand:#7d9cff;--green:#40d9a4;--red:#ff7285}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 540px at 85% -10%,#27376b 0%,transparent 64%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end}.back,.sub,.muted{color:var(--muted)}.back{font-size:12px;text-decoration:none}.back:hover{color:var(--text)}h1{font-size:29px;margin:10px 0 0}.sub{margin:7px 0 0}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.filters label{font-size:11px;color:var(--muted);display:grid;gap:4px}input,button{min-height:39px;border-radius:9px;padding:8px 10px;font:inherit}input{background:#10182c;color:var(--text);border:1px solid var(--line)}button{background:var(--brand);border:0;color:#091024;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;margin:24px 0 16px}.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted)}.tab.active{background:#273f7e;border-color:#6484ed;color:#eef2ff}.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);margin:16px 0}.badge{font-size:10px;font-weight:800;border:1px solid currentColor;padding:4px 7px;border-radius:99px}.ok{color:var(--green)}.critical{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:linear-gradient(140deg,#192342,#111a30);border:1px solid var(--line);border-radius:14px}.card{padding:15px}.label{font-size:11px;font-weight:700;color:var(--muted)}.value{font-size:23px;font-weight:850;margin:7px 0}.detail{font-size:11px;color:#bbc7e2}.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.panel{padding:18px;margin-top:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px}.chart{height:220px;display:flex;align-items:end;gap:7px;padding:10px 3px 25px;border-bottom:1px solid var(--line)}.bar{height:var(--h);min-height:3px;flex:1;background:linear-gradient(#91aaff,#46d7a7);border-radius:6px 6px 0 0;position:relative}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}.table{overflow:auto;max-height:530px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#182442;color:var(--muted);text-transform:uppercase;font-size:10px}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}td:nth-child(2){max-width:310px;overflow:hidden;text-overflow:ellipsis}.notice,.loading{color:var(--muted);line-height:1.65}.loading{padding:80px;text-align:center}@media(max-width:900px){.top{display:block}.filters{margin-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:18px}.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="top"><div><a class="back" href="/clientes">← Todos os clientes</a><h1 id="title">Dashboard do cliente</h1><p class="sub" id="subtitle">Dados exclusivos da Meta Ads API</p></div><div class="filters"><label>De<input id="since" type="date"></label><label>Até<input id="until" type="date"></label><button id="refresh">Atualizar agora</button></div></header><nav id="tabs" class="tabs"></nav><main id="app"><div class="loading">Carregando métricas da Meta…</div></main></main><script>
const $=id=>document.getElementById(id),slug=location.pathname.split('/').filter(Boolean).pop(),clients={'dr-dennis':{id:'act_1517457355761281',endpoint:'/api/dr-dennis'},'dra-roberta':{id:'act_334556975977002',endpoint:'/api/dra-roberta'},'mais-cabelo':{id:'act_1026817869972346',endpoint:'/api/mais-cabelo'},'fernanda-angelo':{id:'act_3833965353594165',endpoint:'/api/fernanda-angelo'}},client=clients[slug],id=client?.id,fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(Number(n)||0),brl=n=>n==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n),pct=n=>Number.isFinite(n)?(n*100).toFixed(2)+'%':'—',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,objective='__all__';function date(){const f=d=>d.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}),now=new Date();$('until').value=f(now);$('since').value=f(new Date(now-29*864e5))}function money(v,a){return a.currency==='BRL'||!a.currency?brl(v):'—'}function total(rows){const m={spend:0,impressions:0,reach:0,clicks:0,leads:0,purchases:0,results:0,purchaseValue:0};rows.forEach(r=>Object.keys(m).forEach(k=>m[k]+=Number(r[k]||0)));return {...m,ctr:m.impressions?m.clicks/m.impressions:null,cpm:m.impressions?m.spend/m.impressions*1000:null,cpc:m.clicks?m.spend/m.clicks:null,cpl:m.leads?m.spend/m.leads:null,cpr:m.results?m.spend/m.results:null,frequency:m.reach?m.impressions/m.reach:null,roas:m.spend?m.purchaseValue/m.spend:null}}function card(l,v,d){return `<article class="card"><div class="label">${l}</div><div class="value">${v}</div><div class="detail">${d}</div></article>`}function guideCards(m,a,category){const labels={'Mensagens · WhatsApp':'Conversas no WhatsApp',Mensagens:'Conversas iniciadas',Leads:'Leads Meta',Tráfego:'PageViews / cliques de link',Vendas:'Compras',Engajamento:'Engajamentos',Reconhecimento:'Alcance'};const label=labels[category]||'Resultado Meta',result=card(label,fmt(m.results),'Custo por resultado '+money(m.cpr,a)),delivery=card('Impressões',fmt(m.impressions),'Alcance '+fmt(m.reach));if(category==='Vendas')return card('Investimento',money(m.spend,a),'Meta · período selecionado')+result+card('Valor de compras',money(m.purchaseValue,a),'Meta · omni_purchase')+card('ROAS',m.roas==null?'—':m.roas.toFixed(2)+'x','Valor de compras / investimento')+card('CPM',money(m.cpm,a),'Por mil impressões')+delivery;if(category==='Reconhecimento')return card('Investimento',money(m.spend,a),'Meta · período selecionado')+result+delivery+card('Frequência',m.frequency==null?'—':m.frequency.toFixed(2),'Impressões / alcance')+card('CPM',money(m.cpm,a),'Por mil impressões');if(category==='__all__')return card('Investimento',money(m.spend,a),'Meta · período selecionado')+delivery+card('Cliques de link',fmt(m.clicks),'CTR '+pct(m.ctr)+' · CPC '+money(m.cpc,a))+card('Leads Meta',fmt(m.leads),'CPL '+money(m.cpl,a))+card('Compras',fmt(m.purchases),'Evento omni_purchase')+card('CPM',money(m.cpm,a),'Por mil impressões')+card('Campanhas com dados',fmt(m.campaigns||0),'Filtro atual')+card('Objetivos',fmt(a.objectives.length),'Meta');return card('Investimento',money(m.spend,a),'Meta · período selecionado')+result+card('Cliques de link',fmt(m.clicks),'CTR '+pct(m.ctr)+' · CPC '+money(m.cpc,a))+delivery+card('CPM',money(m.cpm,a),'Por mil impressões')}function render(){const a=data.accounts[0],rows=objective==='__all__'?a.campaigns:a.campaigns.filter(r=>r.objective===objective),m=total(rows),daily=objective==='__all__'?a.daily:[],max=Math.max(1,...daily.map(r=>r.spend));$('title').textContent=a.name;$('subtitle').textContent=`${a.id} · Fonte: Meta Ads API · Moeda Meta: ${a.currency||'não informada'}`;$('tabs').innerHTML=['__all__',...a.objectives].map(o=>`<button class="tab ${o===objective?'active':''}" data-objective="${esc(o)}">${o==='__all__'?'Todos os objetivos':esc(o)}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{objective=b.dataset.objective;render()});const chart=daily.length?daily.map(r=>`<div class="bar" title="${r.date}: ${money(r.spend,a)}" style="--h:${Math.max(3,r.spend/max*100)}%"><span>${r.date.slice(5)}</span></div>`).join(''):'<div class="notice">A série diária é exibida no consolidado de todos os objetivos.</div>';const rowsHtml=rows.map(r=>`<tr><td>${esc(r.objective)}</td><td title="${esc(r.id)}">${esc(r.name)}</td><td>${esc(r.status)}</td><td>${money(r.spend,a)}</td><td>${fmt(r.impressions)}</td><td>${fmt(r.reach)}</td><td>${fmt(r.clicks)}</td><td>${pct(r.ctr)}</td><td>${money(r.cpm,a)}</td><td>${money(r.cpc,a)}</td><td>${fmt(r.leads)}</td><td>${money(r.cpl,a)}</td><td>${fmt(r.purchases)}</td><td>${fmt(r.results)}</td><td>${money(r.cpr,a)}</td></tr>`).join('')||'<tr><td colspan="15" class="notice">Sem dados da Meta neste período.</td></tr>';$('app').innerHTML=`<div class="status"><span class="badge ${a.health.toLowerCase()}">${a.health}</span><span>Atualizado em ${new Date(data.generatedAt).toLocaleString('pt-BR')}</span>${a.limitation?`<span>${esc(a.limitation)}</span>`:''}</div><section class="grid">${guideCards({...m,campaigns:rows.length},a,objective)}</section><section class="split"><section class="panel"><div class="head"><b>Investimento diário</b><span class="muted">${data.range.since} a ${data.range.until}</span></div><div class="chart">${chart}</div></section><section class="panel notice"><b>Leitura dos dados</b><p>Fonte exclusiva: Meta Ads API. Não há planilhas ou outras fontes.</p><p>Atualização automática a cada ${data.refreshIntervalSeconds} segundos; a Meta pode ter atraso de processamento.</p></section></section><section class="panel"><div class="head"><b>Campanhas</b><span class="muted">Objetivo selecionado acima</span></div><div class="table"><table><thead><tr><th>Objetivo</th><th>Campanha</th><th>Status</th><th>Investimento</th><th>Impressões</th><th>Alcance</th><th>Cliques</th><th>CTR</th><th>CPM</th><th>CPC</th><th>Leads Meta</th><th>CPL</th><th>Compras</th><th>Resultado Meta</th><th>Custo / resultado</th></tr></thead><tbody>${rowsHtml}</tbody></table></div></section>`}function showLogin(){const app=$('app');app.innerHTML='<section class="panel"><h2>Área protegida</h2><p class="notice">Informe a senha deste cliente para visualizar os dados.</p><form id="login"><input id="password" type="password" autocomplete="current-password" placeholder="Senha" required><button>Entrar</button><p class="notice" id="loginError"></p></form></section>';$('login').onsubmit=async event=>{event.preventDefault();const result=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({account:id,password:$('password').value})});if(!result.ok){$('loginError').textContent='Senha inválida.';return;}load(true).catch(fail)}}async function load(force=false){const q=new URLSearchParams({since:$('since').value,until:$('until').value});if(force)q.set('refresh','1');const r=await fetch((client?.endpoint||'/api/dashboard')+'?'+q,{credentials:'same-origin'});data=await r.json();if(r.status===401){showLogin();return;}if(!r.ok||data.error)throw new Error(data.error||'Falha ao atualizar dados.');render()}function fail(e){$('app').innerHTML=`<div class="loading">Erro: ${esc(e.message)}</div>`}date();$('refresh').onclick=()=>load(true).catch(fail);['since','until'].forEach(k=>$(k).onchange=()=>load().catch(fail));load().catch(fail);setInterval(()=>load().catch(()=>{}),60000);
</script></body></html>
