<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gestor IA · Dashboard</title>
  <style>
    :root{--bg:#0b1020;--panel:#151e35;--line:#2c3a5d;--text:#f4f7ff;--muted:#9aa8c8;--brand:#8aa4ff;--green:#47d9a8;--red:#ff7285}*{box-sizing:border-box}body{margin:0;background:radial-gradient(900px 540px at 85% -10%,#27376b 0%,transparent 64%),var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1550px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:22px;align-items:end}.back,.sub,.muted{color:var(--muted)}.back{font-size:12px;text-decoration:none}.back:hover{color:var(--text)}h1{margin:10px 0 0;font-size:29px}.sub{margin:7px 0 0}.filters{display:flex;gap:9px;flex-wrap:wrap;align-items:end}.filters label{font-size:11px;color:var(--muted);display:grid;gap:4px}input,button{min-height:39px;padding:8px 10px;border-radius:9px;font:inherit}input{background:#10182c;color:var(--text);border:1px solid var(--line)}button{border:0;background:var(--brand);color:#091024;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;overflow:auto;margin:24px 0 16px}.tab{white-space:nowrap;background:var(--panel);border:1px solid var(--line);color:var(--muted)}.tab.active{background:#273f7e;border-color:#6484ed;color:#eef2ff}.status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);margin:16px 0}.badge{font-size:10px;font-weight:800;border:1px solid currentColor;padding:4px 7px;border-radius:99px}.ok{color:var(--green)}.critical{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:linear-gradient(140deg,#192342,#111a30);border:1px solid var(--line);border-radius:14px}.card{padding:15px}.label{font-size:11px;font-weight:700;color:var(--muted)}.value{font-size:23px;font-weight:850;margin:7px 0}.detail{font-size:11px;color:#bbc7e2}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{padding:18px;margin-top:16px}.head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px}.chart{height:230px;display:flex;align-items:end;gap:7px;padding:10px 3px 26px;border-bottom:1px solid var(--line)}.bar{height:var(--h);min-height:3px;flex:1;border-radius:6px 6px 0 0;position:relative;background:linear-gradient(#91aaff,#46d7a7)}.bar.result{background:linear-gradient(#8c74ef,#ffb86c)}.bar span{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--muted);white-space:nowrap}.empty{color:var(--muted);margin:auto;text-align:center}.table{overflow:auto;max-height:520px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th{position:sticky;top:0;background:#182442;color:var(--muted);text-transform:uppercase;font-size:10px}th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}td:nth-child(2){max-width:320px;overflow:hidden;text-overflow:ellipsis}@media(max-width:900px){.top{display:block}.filters{margin-top:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}@media(max-width:520px){.wrap{padding:18px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <header class="top"><div><a class="back" href="/clientes">← Dashboards</a><h1 id="title">Dashboard do cliente</h1><p class="sub" id="subtitle">Dados exclusivos da Meta Ads API</p></div><div class="filters"><label>De<input id="since" type="date"></label><label>Até<input id="until" type="date"></label><button id="refresh">Atualizar</button></div></header>
  <nav id="tabs" class="tabs"></nav><div id="app"><div class="empty">Carregando dados da Meta…</div></div>
</main><script>
const $=id=>document.getElementById(id),slug=location.pathname.split('/').filter(Boolean).pop(),clients={'dr-dennis':{endpoint:'/api/dr-dennis'},'dra-roberta':{endpoint:'/api/dra-roberta'},'mais-cabelo':{endpoint:'/api/mais-cabelo'},'fernanda-angelo':{endpoint:'/api/fernanda-angelo'}},client=clients[slug],fmt=n=>new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0}).format(Number(n)||0),brl=n=>n==null?'—':new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n),pct=n=>Number.isFinite(n)?(n*100).toFixed(2)+'%':'—',esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data,objective='__all__';
function dates(){const f=d=>d.toLocaleDateString('en-CA',{timeZone:'America/Sao_Paulo'}),now=new Date();$('until').value=f(now);$('since').value=f(new Date(now-29*864e5))}function money(value,account){return account.currency==='BRL'||!account.currency?brl(value):'—'}function sum(rows){const out={spend:0,impressions:0,reach:0,clicks:0,leads:0,purchases:0,results:0,purchaseValue:0};rows.forEach(row=>Object.keys(out).forEach(key=>out[key]+=Number(row[key]||0)));return {...out,ctr:out.impressions?out.clicks/out.impressions:null,cpm:out.impressions?out.spend/out.impressions*1000:null,cpc:out.clicks?out.spend/out.clicks:null,cpr:out.results?out.spend/out.results:null,frequency:out.reach?out.impressions/out.reach:null,roas:out.spend?out.purchaseValue/out.spend:null}}function card(label,value,detail){return `<article class="card"><div class="label">${label}</div><div class="value">${value}</div><div class="detail">${detail}</div></article>`}function labelFor(category){return {'Mensagens · WhatsApp':'Conversas no WhatsApp',Mensagens:'Conversas iniciadas',Leads:'Leads Meta',Tráfego:'PageViews / cliques de link',Vendas:'Compras',Engajamento:'Engajamentos',Reconhecimento:'Alcance'}[category]||'Resultado Meta'}function cards(m,a,category,count){const result=card(labelFor(category),fmt(m.results),'Custo por resultado '+money(m.cpr,a)),delivery=card('Impressões',fmt(m.impressions),'Alcance '+fmt(m.reach));if(category==='Vendas')return card('Investimento',money(m.spend,a),'Meta · período selecionado')+result+card('Valor de compras',money(m.purchaseValue,a),'Meta · omni_purchase')+card('ROAS',m.roas==null?'—':m.roas.toFixed(2)+'x','Valor de compras / investimento')+delivery+card('CPM',money(m.cpm,a),'Por mil impressões');if(category==='Reconhecimento')return card('Investimento',money(m.spend,a),'Meta · período selecionado')+result+delivery+card('Frequência',m.frequency==null?'—':m.frequency.toFixed(2),'Impressões / alcance')+card('CPM',money(m.cpm,a),'Por mil impressões');if(category==='__all__')return card('Investimento',money(m.spend,a),'Meta · período selecionado')+delivery+card('Cliques de link',fmt(m.clicks),'CTR '+pct(m.ctr)+' · CPC '+money(m.cpc,a))+card('Leads Meta',fmt(m.leads),'Meta')+card('Compras',fmt(m.purchases),'omni_purchase')+card('Campanhas com dados',fmt(count),'Filtro atual');return card('Investimento',money(m.spend,a),'Meta · período selecionado')+result+card('Cliques de link',fmt(m.clicks),'CTR '+pct(m.ctr)+' · CPC '+money(m.cpc,a))+delivery+card('CPM',money(m.cpm,a),'Por mil impressões')}
function selected(rows){return objective==='__all__'?rows:rows.filter(row=>row.objective===objective)}function dailyRows(account){const buckets=new Map();for(const row of selected(account.daily)){if(!buckets.has(row.date))buckets.set(row.date,[]);buckets.get(row.date).push(row)}return [...buckets].map(([date,rows])=>({date,...sum(rows)})).sort((a,b)=>a.date.localeCompare(b.date))}function chart(rows,key,account,type){if(!rows.length)return '<div class="empty">Sem dados neste filtro.</div>';const max=Math.max(1,...rows.map(row=>Number(row[key]||0)));const label=key==='spend'?'Investimento':'Resultado';return rows.map(row=>`<div class="bar ${type||''}" title="${esc('Data: '+row.date+' · '+label+': '+(key==='spend'?money(row[key],account):fmt(row[key])))}" style="--h:${Math.max(3,Number(row[key]||0)/max*100)}%"><span>${row.date.slice(5)}</span></div>`).join('')}
function tableRows(rows,account,creative=false){return rows.map(row=>`<tr><td>${esc(row.objective)}</td><td title="${esc(row.id)}">${esc(row.name)}</td>${creative?`<td>${esc(row.campaign)}</td>`:''}<td>${esc(row.status||'—')}</td><td>${money(row.spend,account)}</td><td>${fmt(row.impressions)}</td><td>${fmt(row.reach)}</td><td>${fmt(row.clicks)}</td><td>${pct(row.ctr)}</td><td>${money(row.cpc,account)}</td><td>${fmt(row.results)}</td><td>${money(row.cpr,account)}</td></tr>`).join('')||`<tr><td class="empty" colspan="${creative?12:11}">Sem dados neste filtro.</td></tr>`}
function render(){const account=data.accounts[0],campaigns=selected(account.campaigns),creatives=selected(account.creatives||[]),m=sum(campaigns),daily=dailyRows(account);$('title').textContent=account.name;$('subtitle').textContent=`${account.id} · Meta Ads API · ${data.range.since} a ${data.range.until}`;$('tabs').innerHTML=['__all__',...account.objectives].map(item=>`<button class="tab ${item===objective?'active':''}" data-objective="${esc(item)}">${item==='__all__'?'Todos os objetivos':esc(item)}</button>`).join('');$('tabs').querySelectorAll('button').forEach(button=>button.onclick=()=>{objective=button.dataset.objective;render()});$('app').innerHTML=`<div class="status"><span class="badge ${account.health.toLowerCase()}">${account.health}</span><span>Atualizado em ${new Date(data.generatedAt).toLocaleString('pt-BR')}</span>${account.limitation?`<span>${esc(account.limitation)}</span>`:''}</div><section class="grid">${cards(m,account,objective,campaigns.length)}</section><section class="two"><section class="panel"><div class="head"><b>Investimento por dia</b><span class="muted">Aplicado ao filtro atual</span></div><div class="chart">${chart(daily,'spend',account,'')}</div></section><section class="panel"><div class="head"><b>${esc(labelFor(objective))} por dia</b><span class="muted">Aplicado ao filtro atual</span></div><div class="chart">${chart(daily,'results',account,'result')}</div></section></section><section class="panel"><div class="head"><b>Resultados por campanha</b><span class="muted">${fmt(campaigns.length)} campanhas com dados</span></div><div class="table"><table><thead><tr><th>Objetivo</th><th>Campanha</th><th>Status</th><th>Investimento</th><th>Impressões</th><th>Alcance</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>Resultado</th><th>Custo / resultado</th></tr></thead><tbody>${tableRows(campaigns,account)}</tbody></table></div></section><section class="panel"><div class="head"><b>Resultados por criativo</b><span class="muted">${fmt(creatives.length)} criativos com dados</span></div><div class="table"><table><thead><tr><th>Objetivo</th><th>Criativo</th><th>Campanha</th><th>Status</th><th>Investimento</th><th>Impressões</th><th>Alcance</th><th>Cliques</th><th>CTR</th><th>CPC</th><th>Resultado</th><th>Custo / resultado</th></tr></thead><tbody>${tableRows(creatives,account,true)}</tbody></table></div></section>`}
async function load(force=false){if(!client)throw new Error('Dashboard não encontrado.');$('app').innerHTML='<div class="empty">Atualizando dados da Meta…</div>';const query=new URLSearchParams({since:$('since').value,until:$('until').value});if(force)query.set('refresh','1');const response=await fetch(client.endpoint+'?'+query);data=await response.json();if(!response.ok||data.error)throw new Error(data.error||'Falha ao atualizar.');render()}function fail(error){$('app').innerHTML=`<div class="empty">Erro: ${esc(error.message)}</div>`}dates();$('refresh').onclick=()=>load(true).catch(fail);['since','until'].forEach(id=>$(id).onchange=()=>load().catch(fail));load().catch(fail);setInterval(()=>load().catch(()=>{}),60000);
</script><script src="/client-dashboard-google.js"></script></body></html>
